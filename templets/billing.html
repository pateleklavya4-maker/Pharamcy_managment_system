<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POS Billing - Pharmacy System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">💊 MediCare Pharmacy</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Search & Stock</a>
                <a class="nav-link" href="/expiry">Expiry Tracker</a>
                <a class="nav-link active" href="/billing">POS Billing</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Create New Bill</h4>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Customer Name</label>
                            <input type="text" name="customer_name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="customer_phone" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Select Active Batch</label>
                            <select name="batch_id" class="form-select" required>
                                {% for b in batches %}
                                    <option value="{{ b.batch_id }}">
                                        {{ b.med_name }} ({{ b.brand_name }}) - Batch: {{ b.batch_number }} | Exp: {{ b.expiry_date }} | Stock: {{ b.stock_qty }} | ₹{{ b.unit_price }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" name="quantity" class="form-control" min="1" value="1" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Complete Sale & Print Bill</button>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Recent Transactions</h4>
                    <ul class="list-group">
                        {% for bill in bills %}
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>{{ bill.customer_name }}</strong><br>
                                    <small class="text-muted">{{ bill.bill_date }}</small>
                                </div>
                                <span class="badge bg-primary rounded-pill">₹{{ "%.2f"|format(bill.total_amount) }}</span>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/billing.js') }}"></script>
</body>
</html>
